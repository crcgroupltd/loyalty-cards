services:
  wallet:
    # Published image (amd64 + arm64). Pin a version, e.g. :0.1.0, for
    # controlled upgrades. To build from source instead, clone the repo,
    # comment out "image" and uncomment "build".
    image: ghcr.io/bossmanc0/loyalty-cards:latest
    # build: .
    container_name: loyalty-cards
    restart: unless-stopped
    # Only your reverse proxy should reach this port. If the proxy runs in
    # Docker on the same network, you can remove "ports" entirely.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ORIGIN: https://cards.example.com # change to your domain
      TRUST_PROXY: "1"
      SETUP_TOKEN: "" # optional; otherwise printed in `docker compose logs`
      LOGO_API_KEY: "" # optional logo.dev secret key (sk_...)
      # SOURCE_URL: https://github.com/you/your-fork # required by the AGPL if you run a modified version
    volumes:
      # Named volume: Docker creates it owned by the app's user, so there are
      # no host permission problems. To use a host folder instead, replace
      # with "./data:/data" and make the folder writable by UID 1000.
      - wallet-data:/data

volumes:
  wallet-data:
    name: loyalty-cards-data
